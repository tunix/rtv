name: Renovate

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"

permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check for RENOVATE_TOKEN
        id: token-check
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "RENOVATE_TOKEN secret not configured — skipping Renovate."
            echo "Add a fine-grained PAT (repo + workflow scopes) as the RENOVATE_TOKEN secret to enable it."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Renovate
        if: steps.token-check.outputs.configured == 'true'
        uses: renovatebot/github-action@f3a31a786096ba6b40d0f0ffe11a494ef73bfa7c # v46.3.4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
