<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2779dc"/>
      <stop offset="1" stop-color="#0e3f80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rust-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d15a2b"/>
      <stop offset="1" stop-color="#9a3a14"/>
    </linearGradient>
    <linearGradient id="card-dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf9f8"/>
      <stop offset="1" stop-color="#e9e7e3"/>
    </linearGradient>
    <linearGradient id="card-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfaf9"/>
      <stop offset="1" stop-color="#edece9"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f75c17"/>
      <stop offset="1" stop-color="#cf3c00"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>

  <!-- back channel card, rust tint -->
  <g transform="translate(249 247) rotate(-13)">
    <rect x="-120" y="-158" width="240" height="316" rx="30" fill="url(#rust-card)" opacity="0.85"/>
  </g>

  <!-- middle channel card -->
  <g transform="translate(262 260)">
    <rect x="-112" y="-148" width="224" height="296" rx="28" fill="url(#card-dim)" opacity="0.58"/>
  </g>

  <!-- front channel card -->
  <g transform="translate(274 272) rotate(11)">
    <rect x="-105" y="-140" width="210" height="280" rx="26" fill="url(#card-front)"/>
    <path d="M -63 -48 L 12 0 L -63 48 Z" fill="url(#play)" stroke="url(#play)" stroke-width="15" stroke-linejoin="round"/>
    <circle cx="40" cy="0" r="9.5" fill="#f75c17"/>
    <path d="M 58.1 -20.1 A 27 27 0 0 1 58.1 20.1" fill="none" stroke="#e04d0e" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
