[package]
name = "rtv"
version = "0.1.0"
edition = "2021"
description = "IPTV player for the GNOME desktop"
license = "GPL-3.0"

[profile.release]
lto = true
strip = true

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
gio = "0.22.10"
glib = "0.22.10"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
glib-build-tools = "0.22.8"
